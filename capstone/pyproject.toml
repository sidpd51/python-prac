[project]
name = "docmind"
version = "0.0.1"
description = "Capstone: an evolving document-intelligence system (ingestion -> RAG -> agents -> production)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=2.0",
]

[project.scripts]
docmind = "docmind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmind"]
