<div class="widget" data-widget="backoff">
  <h3 class="w-title">Exponential backoff with full jitter</h3>
  <p class="w-sub">Wait is <code>uniform(0, min(max_delay, base × 2^attempt))</code>. The pale bar is the cap, the solid bar is one random draw.</p>
  <div class="sliders">
    <label>Base delay <output data-o="base">0.5</output> s<input type="range" min="0.1" max="2" step="0.1" value="0.5" data-in="base"></label>
    <label>Max delay <output data-o="max">20</output> s<input type="range" min="2" max="60" step="1" value="20" data-in="max"></label>
    <label>Retries <output data-o="n">6</output><input type="range" min="1" max="10" value="6" data-in="n"></label>
    <label>Retry-After header <output data-o="ra">off</output><input type="range" min="0" max="30" value="0" data-in="ra"></label>
  </div>
  <div class="bars"></div>
  <div class="lz-controls"><button type="button" class="btn" data-resample>Draw again</button><span class="lz-count" data-total></span></div>
  <p class="w-note">Without jitter, clients that failed together retry together and hit the API in waves. A numeric <code>Retry-After</code> overrides the formula.</p>
</div>
