<div class="widget" data-widget="srs">
  <h3 class="w-title">Spaced repetition and mastery, hands on</h3>
  <p class="w-sub">Review a topic on the day it falls due and grade yourself. Watch how the next review moves.</p>
  <div class="grades" role="group" aria-label="Add a review with grade">
    <button type="button" data-g="0">0 blank</button><button type="button" data-g="1">1 wrong</button><button type="button" data-g="2">2 partial</button>
    <button type="button" data-g="3">3 effortful</button><button type="button" data-g="4">4 solid</button><button type="button" data-g="5">5 teach it</button>
    <button type="button" class="ghost" data-reset>Reset</button>
  </div>
  <div class="tablewrap"><table class="srs-table"><thead><tr><th>#</th><th>Day</th><th>Grade</th><th>Next review in</th><th>Ease</th></tr></thead><tbody></tbody></table></div>
  <div class="srs-line" aria-hidden="true"></div>
  <h4 class="w-h4">Mastery calculator</h4>
  <div class="sliders">
    <label>Recent self / quiz grade <output data-o="avg">3.5</output><input type="range" min="0" max="5" step="0.5" value="3.5" data-in="avg"></label>
    <label>Exercise tests passed <output data-o="pass">6</output><input type="range" min="0" max="12" value="6" data-in="pass"></label>
    <label>Exercise tests failed <output data-o="fail">2</output><input type="range" min="0" max="12" value="2" data-in="fail"></label>
    <label>Days overdue <output data-o="over">0</output><input type="range" min="0" max="30" value="0" data-in="over"></label>
  </div>
  <div class="meter"><div class="meter-fill" data-meter></div><span class="meter-num" data-mnum></span></div>
  <p class="w-note" data-mnote></p>
</div>
