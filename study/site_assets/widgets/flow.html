<div class="widget" data-widget="flow">
  <h3 class="w-title">One module, five commands</h3>
  <p class="w-sub">The loop that keeps solutions, tests, stubs and questions honest.</p>
  <ol class="flow">
    <li data-title="Write the solution" data-body="The docstring is the full problem spec. Put it in solutions/&lt;track&gt;/&lt;NN_module&gt;/exNN_name.py as idiomatic, typed code." data-cmd="solutions/py/08_generators/ex01_log_pipeline.py"><b>1</b><span>Solution</span></li>
    <li data-title="Write the tests" data-body="Tests load the exercise through study.loader.load and carry @pytest.mark.topic with full topic ids. Test behaviour and the concept, not the implementation." data-cmd="exercises/py/08_generators/test_ex01_log_pipeline.py"><b>2</b><span>Tests</span></li>
    <li data-title="Verify" data-body="Runs your tests against the reference solutions. Everything must pass, otherwise the test is wrong, not the learner." data-cmd="study verify generators"><b>3</b><span>Verify</span></li>
    <li data-title="Generate stubs" data-body="Bodies become raise NotImplementedError, private helpers are dropped, imports are pruned. Existing files are never overwritten, so your work is safe." data-cmd="study stubs generators"><b>4</b><span>Stubs</span></li>
    <li data-title="Check" data-body="Every test on an unsolved stub must show as skipped (TODO). Then study check confirms every topic has an exercise or a question." data-cmd="study check generators"><b>5</b><span>Check</span></li>
  </ol>
  <div class="panel" data-panel aria-live="polite"><strong>Pick a step.</strong></div>
</div>
