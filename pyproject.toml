[project]
name = "ai-eng-prep"
version = "0.1.0"
description = "Personal AI-engineering prep system: curriculum, exercises, spaced-repetition tracker, interview bank, capstone."
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "markdown>=3.6",
    "pygments>=2.18",
]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
study = "study.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["study"]
include = ["study/site_assets/*"]

[tool.uv.workspace]
members = ["capstone"]

[tool.pytest.ini_options]
testpaths = ["exercises", "capstone/tests"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP046", "UP047", "SIM108", "SIM113"]  # formatter owns line length; TypeVar style is fine for learning

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
